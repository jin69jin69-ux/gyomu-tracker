<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>業務遂行トラッカー</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F1A33">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="業務遂行">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap');

  :root{
    --bg:#0F1A33; --card:#17244A; --ink:#F3EEDD; --ink-soft:#9FACC9; --line:#2C3D66;
    --amber:#D4AF37; --teal:#D4AF37; --danger:#D9705F; --purple:#E8CB6E;
    --gold-dim:#8A7328; --input-bg:#1C2A52;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Zen Kaku Gothic New', sans-serif; -webkit-font-smoothing:antialiased; }
  .app{ max-width:440px; margin:0 auto; padding:28px 18px 60px; }
  .eyebrow{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.14em; color:var(--ink-soft); text-transform:uppercase; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
  .eyebrow .link{ color:var(--purple); cursor:pointer; text-decoration:underline; letter-spacing:0; text-transform:none; font-family:'Zen Kaku Gothic New', sans-serif; font-size:12px; }
  h1{ font-size:24px; font-weight:900; margin:0 0 6px; letter-spacing:.01em; }
  .sub{ font-size:13px; color:var(--ink-soft); margin:0 0 22px; line-height:1.6; }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:14px; }
  .progress-bar-wrap{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .progress-bar-wrap b{ font-family:'JetBrains Mono', monospace; font-size:20px; color:var(--amber); }
  .progress-track{ height:8px; border-radius:4px; background:var(--line); overflow:hidden; margin-bottom:4px; }
  .progress-fill{ height:100%; background:var(--teal); border-radius:4px; transition:width 0.3s ease; }

  .task-row{ display:flex; align-items:flex-start; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
  .task-row:last-child{ border-bottom:none; }
  .task-check{
    width:26px; height:26px; border-radius:50%; border:2px solid var(--line); background:var(--input-bg); flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; cursor:pointer; margin-top:2px; font-size:14px; color:#101B33;
  }
  .task-check.done{ background:var(--teal); border-color:var(--teal); }
  .task-body{ flex:1; min-width:0; }
  .task-name{ font-size:14.5px; font-weight:700; line-height:1.4; }
  .task-row.done .task-name{ color:var(--ink-soft); text-decoration:line-through; }
  .task-meta{ display:flex; gap:8px; margin-top:4px; flex-wrap:wrap; }
  .task-badge{
    font-family:'JetBrains Mono', monospace; font-size:11px; padding:2px 7px; border-radius:6px;
    background:var(--input-bg); color:var(--ink-soft); border:1px solid var(--line);
  }
  .task-actions{ display:flex; gap:6px; flex:0 0 auto; }
  .friend-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;
    padding:12px 0; border-bottom:1px solid var(--line);
  }
  .friend-row:last-child{ border-bottom:none; }
  .friend-row .name{ font-size:13.5px; flex:1 1 auto; min-width:0; }
  .friend-row button{
    font-family:'Zen Kaku Gothic New', sans-serif; font-size:12px; padding:6px 10px; border-radius:8px;
    border:1px solid var(--line); background:var(--input-bg); color:var(--ink-soft); cursor:pointer; flex:0 0 auto;
  }
  .task-actions button{ border:none; background:none; color:var(--ink-soft); font-size:12px; cursor:pointer; padding:4px; }
  .empty-note{ font-size:12.5px; color:var(--ink-soft); text-align:center; padding:18px 0; }

  input[type="text"], input[type="time"], input[type="number"]{
    width:100%; font-family:'Zen Kaku Gothic New', sans-serif; font-size:16px;
    padding:12px 14px; border-radius:9px; border:1px solid var(--line); background:var(--input-bg); color:var(--ink);
  }
  input[type="time"]{ font-family:'JetBrains Mono', monospace; font-weight:700; }
  label.field-label{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:6px; }
  .field{ margin-bottom:16px; }
  .toggle-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .toggle-row .switch{
    width:42px; height:24px; border-radius:12px; background:var(--line); position:relative; cursor:pointer; flex:0 0 auto;
  }
  .toggle-row .switch.on{ background:var(--teal); }
  .toggle-row .switch .knob{ position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .15s ease; }
  .toggle-row .switch.on .knob{ left:20px; }

  .stepper-row{ display:flex; align-items:center; justify-content:center; gap:10px; background:var(--input-bg); border:1px solid var(--line); border-radius:9px; padding:12px; }
  .stepper-row button{ width:36px; height:36px; border-radius:8px; border:none; background:var(--amber); color:#101B33; font-size:16px; font-weight:700; cursor:pointer; }
  .min-input{ width:80px; text-align:center; font-family:'JetBrains Mono', monospace; font-size:20px; font-weight:700; padding:6px 4px; border-radius:9px; border:1px solid var(--line); background:var(--input-bg); color:var(--ink); }

  .btn-row{ display:flex; gap:10px; margin-top:18px; }
  .btn{ flex:1; font-family:'Zen Kaku Gothic New', sans-serif; font-size:14.5px; font-weight:700; padding:13px 10px; border-radius:9px; border:none; cursor:pointer; }
  .btn-primary{ background:var(--amber); color:#101B33; }
  .btn-primary:disabled{ background:#3A4568; color:#7A879E; cursor:not-allowed; }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--line); }

  .friend-link{ display:block; text-align:center; font-size:13px; color:var(--ink-soft); text-decoration:underline; margin-top:6px; cursor:pointer; background:none; border:none; width:100%; padding:10px; }
  .nav-btn-row{ display:flex; gap:10px; margin-top:14px; }
  .nav-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    padding:16px 8px; border-radius:12px; border:1px solid var(--line); background:var(--card);
    color:var(--ink); font-family:'Zen Kaku Gothic New', sans-serif; font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .nav-btn .nav-icon{ font-size:22px; }
  .nav-btn:active{ background:var(--input-bg); }

  .month-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .month-nav button{ border:none; background:var(--card); border:1px solid var(--line); width:34px; height:34px; border-radius:8px; font-size:15px; cursor:pointer; }
  .month-nav .label{ font-weight:900; font-size:16px; }
  .month-stats{ display:flex; justify-content:space-around; text-align:center; margin-bottom:16px; }
  .month-stats .stat b{ display:block; font-family:'JetBrains Mono', monospace; font-size:20px; color:var(--amber); }
  .month-stats .stat span{ font-size:11px; color:var(--ink-soft); }
  .month-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .month-dow{ text-align:center; font-size:10.5px; color:var(--ink-soft); font-weight:700; padding-bottom:4px; }
  .month-cell{
    aspect-ratio:1; border-radius:9px; border:1px solid var(--line); background:var(--card);
    display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; position:relative;
    font-family:'JetBrains Mono', monospace;
  }
  .month-cell.empty{ visibility:hidden; cursor:default; }
  .month-cell.today{ border-color:var(--amber); border-width:2px; }
  .month-cell .daynum{ font-size:12px; font-weight:700; }
  .month-cell .ratio{ font-size:8.5px; color:var(--ink-soft); }
  .month-cell.all-done{ background:#2E2712; }
  .month-cell.all-done .daynum{ color:var(--amber); }
  .month-cell.partial{ background:#241C0E; }
  .month-cell.partial .daynum{ color:var(--purple); }
  .dot{ width:5px; height:5px; border-radius:50%; margin-top:2px; }
  .dot.all-done{ background:var(--amber); }
  .dot.partial{ background:var(--purple); }

  .busy-row{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .busy-row input[type="time"]{ flex:1; }
  .busy-row .to{ font-size:12px; color:var(--ink-soft); }
  .busy-row button{ border:none; background:none; color:var(--danger); font-size:12px; cursor:pointer; flex:0 0 auto; }
  .add-busy-btn{
    width:100%; padding:10px; border-radius:9px; border:1px dashed var(--line); background:none;
    color:var(--ink-soft); font-size:12.5px; cursor:pointer; margin-bottom:16px;
  }
  .sched-slot-row{ display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  .sched-slot-row:last-child{ border-bottom:none; }
  .sched-slot-time{ font-family:'JetBrains Mono', monospace; font-weight:700; color:var(--amber); font-size:13px; min-width:100px; }
  .sched-slot-name{ font-size:13.5px; flex:1; }
  .sched-unfit{ background:rgba(217,112,95,0.12); border-radius:9px; padding:12px; margin-top:10px; font-size:12.5px; color:var(--danger); }
  .sched-busy-note{ font-size:11.5px; color:var(--ink-soft); margin-top:10px; line-height:1.7; }

  .deadline-alert{ background:rgba(212,175,55,0.14); border:1px solid var(--amber); border-radius:12px; padding:14px 16px; margin-bottom:14px; }
  .deadline-alert .title{ font-weight:900; color:var(--amber); margin-bottom:8px; font-size:13px; }
  .deadline-alert .item{ font-size:12.5px; padding:4px 0; display:flex; justify-content:space-between; gap:10px; }
  .deadline-alert .item .when{ font-family:'JetBrains Mono', monospace; flex:0 0 auto; }
  .deadline-alert .item.overdue .when{ color:var(--danger); font-weight:700; }
</style>
</head>
<body>
<div class="app">
  <div class="eyebrow"><span id="eyebrowText">WORK TRACKER</span><span><span class="link" id="homeLink" style="display:none;">← 今日</span> <span class="link" id="resetDataLink" style="display:none; margin-left:10px;">🗑️ データ整理</span> <span class="link" id="logoutLink" style="display:none; margin-left:10px;">ログアウト</span></span></div>
  <h1 id="mainTitle">業務遂行トラッカー</h1>
  <p class="sub" id="mainSub">今日やる業務を登録して、終わったらチェック。月間でも進み具合を確認できます。</p>
  <div id="wizard"></div>
</div>

<script>
  // --- Supabase setup ---
  const SUPABASE_URL = 'https://ckwdrankmsncajtvpddr.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_wfJtslqSh3pHYWpUI0DPwQ_bEM8JOzA';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let currentUserId = null;

  // Small helper for plain localStorage values (login session, etc.) — separate
  // from the Supabase-backed cache system used for task data below.
  function lsGet(key){
    try{
      const v = localStorage.getItem(key);
      return v === null ? null : JSON.parse(v);
    }catch(e){ return null; }
  }
  function lsSet(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
  }

  // In-memory cache mirroring the Supabase tables, keyed the same way the old
  // localStorage keys were. All existing render/click-handler code reads and
  // writes through loadTasks/saveTasks/etc. exactly as before — only these
  // low-level functions changed, so the rest of the app is untouched.
  let cache = {};       // { 'tasks-2026-09-16': [...], 'month-tasks-2026-09': [...] }
  let schedCache = {};  // { '2026-09-16': { deadline, busyBlocks } }

  function tasksKey(dateStr){ return 'tasks-' + dateStr; }
  function loadTasks(dateStr){ return loadTasksByKey(tasksKey(dateStr)); }
  function saveTasks(dateStr, tasks){ saveTasksByKey(tasksKey(dateStr), tasks); }
  function monthTasksKey(year, month){ return 'month-tasks-' + year + '-' + String(month+1).padStart(2,'0'); }
  function loadMonthTasks(year, month){ return loadTasksByKey(monthTasksKey(year, month)); }
  function saveMonthTasks(year, month, tasks){ saveTasksByKey(monthTasksKey(year, month), tasks); }

  function loadTasksByKey(key){ return cache[key] || []; }
  function deleteDayTasksByMonthTaskId(monthTaskId){
    Object.keys(cache).forEach(key=>{
      if(!key.startsWith('tasks-')) return;
      const list = cache[key] || [];
      const filtered = list.filter(t => t.monthTaskId !== monthTaskId);
      if(filtered.length !== list.length){
        saveTasksByKey(key, filtered);
      }
    });
  }
  function saveTasksByKey(key, newList){
    const oldList = cache[key] || [];
    diffAndSync(key, oldList, newList);
    cache[key] = newList;
  }

  function schedKey(dateStr){ return 'sched-' + dateStr; }
  function loadSchedSettings(dateStr){ return schedCache[dateStr] || { deadline:'', busyBlocks:[] }; }
  function saveSchedSettings(dateStr, settings){
    schedCache[dateStr] = settings;
    if(!currentUserId) return;
    sb.from('sched_settings')
      .upsert({ user_id: currentUserId, date: dateStr, deadline: settings.deadline || '', busy_blocks: settings.busyBlocks || [] }, { onConflict: 'user_id,date' })
      .then(({error})=>{ if(error) console.error('sched sync', error); });
  }

  function keyToTableInfo(key){
    if(key.startsWith('month-tasks-')){
      const [y, m] = key.slice('month-tasks-'.length).split('-').map(Number);
      return { table: 'month_tasks', extra: { year: y, month: m } };
    }
    if(key.startsWith('tasks-')){
      return { table: 'tasks', extra: { date: key.slice('tasks-'.length) } };
    }
    return null;
  }
  function buildRow(table, extra, item){
    if(table === 'tasks'){
      return { id:item.id, user_id:currentUserId, date:extra.date, name:item.name, min:item.min, time:item.time||'', deadline:item.deadline||null, done:!!item.done, month_task_id:item.monthTaskId||null };
    }
    return { id:item.id, user_id:currentUserId, year:extra.year, month:extra.month, name:item.name, min:item.min, deadline:item.deadline||null, done:!!item.done, recurring_id:item.recurringId||null, scheduled:!!item.scheduled };
  }
  function diffAndSync(key, oldList, newList){
    const info = keyToTableInfo(key);
    if(!info || !currentUserId) return;
    const oldById = new Map(oldList.map(t=>[String(t.id), t]));
    const newIds = new Set(newList.map(t=>String(t.id)));
    oldById.forEach((_, id)=>{
      if(!newIds.has(id)){
        sb.from(info.table).delete().eq('id', id).then(({error})=>{ if(error) console.error('delete', error); });
      }
    });
    newList.forEach(t=>{
      const old = oldById.get(String(t.id));
      const row = buildRow(info.table, info.extra, t);
      if(!old){
        sb.from(info.table).insert(row).then(({error})=>{ if(error) console.error('insert', error); });
      } else if(old.name!==t.name || old.min!==t.min || old.time!==t.time || old.deadline!==t.deadline || !!old.done!==!!t.done || !!old.scheduled!==!!t.scheduled){
        sb.from(info.table).update(row).eq('id', t.id).then(({error})=>{ if(error) console.error('update', error); });
      }
    });
  }

  async function loadAllFromSupabase(){
    cache = {}; schedCache = {};
    const [{ data: taskRows }, { data: monthRows }, { data: schedRows }, { data: recurRows }] = await Promise.all([
      sb.from('tasks').select('*'),
      sb.from('month_tasks').select('*'),
      sb.from('sched_settings').select('*'),
      sb.from('recurring_month_tasks').select('*'),
    ]);
    (taskRows||[]).forEach(r=>{
      const key = tasksKey(r.date);
      if(!cache[key]) cache[key] = [];
      cache[key].push({ id:r.id, name:r.name, min:r.min, time:r.time||'', deadline:r.deadline||'', done:r.done, monthTaskId:r.month_task_id||null });
    });
    (monthRows||[]).forEach(r=>{
      const key = monthTasksKey(r.year, r.month - 1);
      if(!cache[key]) cache[key] = [];
      cache[key].push({ id:r.id, name:r.name, min:r.min, deadline:r.deadline||'', done:r.done, recurringId:r.recurring_id||null, scheduled:!!r.scheduled });
    });
    (schedRows||[]).forEach(r=>{
      schedCache[r.date] = { deadline:r.deadline||'', busyBlocks:r.busy_blocks||[] };
    });
    state.recurringTemplates = recurRows || [];
  }

  async function createRecurringTemplate(name, min, deadlineDay, startYm, endYm){
    const { data, error } = await sb.from('recurring_month_tasks')
      .insert({ user_id: currentUserId, name, min, deadline_day: deadlineDay, start_ym: startYm || null, end_ym: endYm || null })
      .select().single();
    if(error){
      console.error('createRecurringTemplate', error);
      throw new Error('毎月繰り返す設定の保存に失敗しました: ' + (error.message || JSON.stringify(error)));
    }
    if(!state.recurringTemplates) state.recurringTemplates = [];
    state.recurringTemplates.push(data);
    return data.id;
  }

  async function deleteRecurringTemplate(id){
    const { error } = await sb.from('recurring_month_tasks').delete().eq('id', id);
    if(!error && state.recurringTemplates){
      state.recurringTemplates = state.recurringTemplates.filter(t => t.id !== id);
    }
  }

  // Make sure every recurring template has an instance in the given month
  // (creates any that are missing, e.g. when browsing into a new month for the first time).
  async function ensureRecurringTasksForMonth(year, month){
    state.recurringSyncError = '';
    const templates = state.recurringTemplates || [];
    const ym = year + '-' + String(month+1).padStart(2,'0');
    const templatesById = new Map(templates.map(t=>[t.id, t]));
    function templateInRange(t){
      if(t.start_ym && ym < t.start_ym) return false;
      if(t.end_ym && ym > t.end_ym) return false;
      return true;
    }
    const key = monthTasksKey(year, month);
    let existing = cache[key] || [];
    let changed = false;

    // Clean up unfinished instances left behind by a template that's since been deleted,
    // or whose start/end range no longer covers this month (e.g. range narrowed after
    // instances were already generated). Completed tasks are left alone as a record.
    const toPrune = existing.filter(t => t.recurringId && !t.done && (!templatesById.has(t.recurringId) || !templateInRange(templatesById.get(t.recurringId))));
    if(toPrune.length){
      const pruneIds = new Set(toPrune.map(t=>t.id));
      const { error: pruneErr } = await sb.from('month_tasks').delete().in('id', Array.from(pruneIds));
      if(pruneErr){
        console.error('ensureRecurringTasksForMonth prune', pruneErr);
        state.recurringSyncError = '範囲外になった自動生成タスクの削除でエラー: ' + (pruneErr.message || JSON.stringify(pruneErr));
      } else {
        existing = existing.filter(t => !pruneIds.has(t.id));
        cache[key] = existing;
        changed = true;
      }
    }

    const inRangeTemplates = templates.filter(templateInRange);
    if(!inRangeTemplates.length) return changed;
    const existingRecurIds = new Set(existing.map(t => t.recurringId).filter(Boolean));
    const missing = inRangeTemplates.filter(t => !existingRecurIds.has(t.id));
    if(!missing.length) return changed;
    if(!currentUserId){ state.recurringSyncError = 'ログイン情報が見つかりませんでした（currentUserId未設定）。'; return changed; }
    const numDays = daysInMonth(year, month);
    const newRows = missing.map(t => ({
      id: crypto.randomUUID(),
      user_id: currentUserId,
      year, month: month+1,
      name: t.name, min: t.min,
      deadline: t.deadline_day ? monthDateStr(year, month, Math.min(t.deadline_day, numDays)) : null,
      done: false,
      recurring_id: t.id,
    }));
    const { error } = await sb.from('month_tasks').insert(newRows);
    if(error){
      console.error('ensureRecurringTasksForMonth', error);
      state.recurringSyncError = '毎月の業務の自動追加でエラー: ' + (error.message || JSON.stringify(error));
      return changed;
    }
    const mapped = newRows.map(r => ({ id:r.id, name:r.name, min:r.min, deadline:r.deadline||'', done:false, recurringId:r.recurring_id }));
    cache[key] = [...existing, ...mapped];
    return true;
  }

  const state = {
    screen: 'today',
    viewDate: null,       // date string being viewed (today screen / day-detail)
    editingTaskId: null,  // when set, add-task screen is in edit mode
    monthCursor: null,    // {year, month} 0-indexed month
    formName: '', formMin: 30, formTimeOn: false, formTime: '', formDeadline: '',
    formRecurring: false, formDeadlineDay: '', formError: '',
    formStartYm: '', formEndYm: '',
    recurringTemplates: null,
    recurringSyncError: '',
    formScope: 'day',        // 'day' | 'month' — which kind of task list the form is editing
    formStorageKey: null,    // localStorage key the form saves to
    formReturnScreen: 'today', // screen to go back to after save/cancel/delete
    schedDeadline: '',
    schedBusyBlocks: [],   // [{start:'HH:MM', end:'HH:MM'}]
    schedResult: null,     // computed suggestion, or null if not yet run
    monthSchedDeadline: '',
    monthSchedMinPerDay: 60,
    monthSchedSkipWeekends: true,
    monthSchedExcludeDays: [],
    bulkResetNotice: '', bulkResetError: '',
    bulkRangeStart: '', bulkRangeEnd: '',
    monthSchedResult: null,
    authMode: 'login',   // 'login' | 'signup'
    authEmail: '', authPassword: '', authError: '', authBusy: false, authNotice: '',
    adminPassword: '', adminError: '', adminUsers: null, adminNotice: '', adminError2: '',
  };

  function todayStr(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function fmtDateLabel(dateStr){
    const [y,m,d] = dateStr.split('-').map(Number);
    const dow = ['日','月','火','水','木','金','土'][new Date(y,m-1,d).getDay()];
    return `${m}月${d}日(${dow})`;
  }
  function addDays(dateStr, n){
    const [y,m,d] = dateStr.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    dt.setDate(dt.getDate() + n);
    return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
  }
  function getUpcomingDeadlineTasks(){
    const today = todayStr();
    const threshold = addDays(today, 3);
    const results = [];
    Object.keys(cache).forEach(key=>{
      const tasks = cache[key] || [];
      if(key.startsWith('tasks-')){
        const dateStr = key.slice('tasks-'.length);
        tasks.forEach(t=>{
          if(!t.done && t.deadline && t.deadline <= threshold){
            results.push({ name: t.name, deadline: t.deadline, overdue: t.deadline < today, scope: 'day', dateStr });
          }
        });
      } else if(key.startsWith('month-tasks-')){
        tasks.forEach(t=>{
          if(!t.done && t.deadline && t.deadline <= threshold){
            results.push({ name: t.name, deadline: t.deadline, overdue: t.deadline < today, scope: 'month' });
          }
        });
      }
    });
    results.sort((a,b)=> a.deadline < b.deadline ? -1 : a.deadline > b.deadline ? 1 : 0);
    return results;
  }
  function toMin(hhmm){ const [h,m] = hhmm.split(':').map(Number); return h*60+m; }
  function toHHMM(min){
    min = Math.max(0, Math.round(min));
    const h = Math.floor(min/60) % 24, m = min % 60;
    return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');

  function countCacheByPrefix(prefix){

  async function bulkDeleteTable(table){

  async function bulkDeleteMonthTasksInRange(startYm, endYm){
    const { data, error } = await sb.from('month_tasks').select('id, year, month').eq('user_id', currentUserId);
    if(error) return { error, count: 0 };
    const matchIds = (data || []).filter(r=>{
      const ym = r.year + '-' + String(r.month).padStart(2,'0');
      if(startYm && ym < startYm) return false;
      if(endYm && ym > endYm) return false;
      return true;
    }).map(r=>r.id);
    if(!matchIds.length) return { error: null, count: 0 };
    const { error: delErr } = await sb.from('month_tasks').delete().in('id', matchIds);
    if(delErr) return { error: delErr, count: 0 };
    // drop the matching entries from the local cache too
    Object.keys(cache).forEach(key=>{
      if(!key.startsWith('month-tasks-')) return;
      cache[key] = (cache[key] || []).filter(t => !matchIds.includes(t.id));
    });
    return { error: null, count: matchIds.length };
  }

  async function hashPassword(pw){
    const enc = new TextEncoder().encode(pw);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  // --- Schedule builder: fit today's undone tasks into the free time before a deadline ---
  function computeSchedule(dateStr, deadline, busyBlocks){
    const nowD = new Date();
    const isToday = dateStr === todayStr();
    const dayStartMin = isToday ? (nowD.getHours()*60 + nowD.getMinutes()) : 9*60;
    const deadlineMin = toMin(deadline);

    const allTasks = loadTasks(dateStr).filter(t => !t.done);
    const fixedBlocks = allTasks
      .filter(t => t.time)
      .map(t => ({ start: toMin(t.time), end: toMin(t.time) + t.min, label: t.name }));
    const flexibleTasks = allTasks.filter(t => !t.time);
    // Tasks with an earlier deadline are more urgent and get first pick of today's free time.
    // Tasks without a deadline are treated as least urgent and scheduled after all dated ones,
    // keeping their original relative order.
    flexibleTasks.sort((a,b)=>{
      const da = a.deadline || '9999-99-99';
      const db = b.deadline || '9999-99-99';
      return da < db ? -1 : da > db ? 1 : 0;
    });

    const busy = busyBlocks
      .filter(b => b.start && b.end)
      .map(b => ({ start: toMin(b.start), end: toMin(b.end), label: '予定あり' }));

    let occupied = [...busy, ...fixedBlocks].sort((a,b)=> a.start - b.start);
    // merge overlapping occupied intervals so gap-finding is simple
    const merged = [];
    occupied.forEach(b=>{
      if(merged.length && b.start <= merged[merged.length-1].end){
        merged[merged.length-1].end = Math.max(merged[merged.length-1].end, b.end);
      } else {
        merged.push({ ...b });
      }
    });

    // compute free gaps within [dayStartMin, deadlineMin]
    const gaps = [];
    let cursor = dayStartMin;
    merged.forEach(b=>{
      if(b.start > cursor) gaps.push({ start: cursor, end: Math.min(b.start, deadlineMin) });
      cursor = Math.max(cursor, b.end);
    });
    if(cursor < deadlineMin) gaps.push({ start: cursor, end: deadlineMin });
    const freeGaps = gaps.filter(g => g.end > g.start);

    // greedily place flexible tasks into the first gap with enough room
    const placed = [];
    const unfit = [];
    flexibleTasks.forEach(t=>{
      let done = false;
      for(const g of freeGaps){
        if(g.end - g.start >= t.min){
          placed.push({ task: t, start: g.start, end: g.start + t.min });
          g.start += t.min;
          done = true;
          break;
        }
      }
      if(!done) unfit.push(t);
    });

    const fixedForDisplay = fixedBlocks.map(b => ({ task: { name: b.label, min: b.end - b.start }, start: b.start, end: b.end, fixed: true }));
    const combined = [...placed, ...fixedForDisplay].sort((a,b)=> a.start - b.start);

    return { combined, unfit, dayStartMin, deadlineMin, busyCount: busy.length };
  }

  // --- Monthly schedule builder: fit "this month" tasks onto specific days ---
  function computeMonthSchedule(year, month, deadlineDateStr, minPerDay, skipWeekends, excludeDays){
    const monthTasks = loadMonthTasks(year, month).filter(t => !t.done && !t.scheduled);
    const todayD = todayStr();
    const numDays = daysInMonth(year, month);
    const excludeSet = new Set(excludeDays || []);

    // candidate days: from today (or day 1 if viewing a future month) through the deadline date, inclusive
    const candidates = [];
    for(let d=1; d<=numDays; d++){
      const ds = monthDateStr(year, month, d);
      if(ds < todayD) continue;
      if(ds > deadlineDateStr) break;
      if(excludeSet.has(ds)) continue;
      const dow = new Date(year, month, d).getDay();
      if(skipWeekends && (dow === 0 || dow === 6)) continue;
      const dayTasks = loadTasks(ds).filter(t => !t.done);
      const used = dayTasks.reduce((sum,t)=> sum + t.min, 0);
      candidates.push({ dateStr: ds, remaining: Math.max(0, minPerDay - used) });
    }

    const placed = [];   // {task, dateStr, min, part, totalParts} — one entry per day-chunk
    const unfit = [];    // {task, shortfall, scheduledMin} — tasks not fully placed before the deadline

    // Tasks with an earlier deadline are more urgent and get first pick of the available time.
    // Tasks without a deadline are treated as least urgent and scheduled after all dated ones,
    // keeping their original relative order.
    const sortedTasks = [...monthTasks].sort((a,b)=>{
      const da = a.deadline || '9999-99-99';
      const db = b.deadline || '9999-99-99';
      return da < db ? -1 : da > db ? 1 : 0;
    });

    sortedTasks.forEach(t=>{
      let remainingNeed = t.min;
      const chunks = [];
      for(const c of candidates){
        if(remainingNeed <= 0) break;
        if(t.deadline && c.dateStr > t.deadline) continue; // don't schedule past this task's own deadline
        if(c.remaining <= 0) continue;
        const take = Math.min(remainingNeed, c.remaining);
        chunks.push({ dateStr: c.dateStr, min: take });
        c.remaining -= take;
        remainingNeed -= take;
      }
      chunks.forEach((chunk, idx)=>{
        placed.push({ task: t, dateStr: chunk.dateStr, min: chunk.min, part: idx+1, totalParts: chunks.length });
      });
      if(remainingNeed > 0){
        unfit.push({ task: t, shortfall: remainingNeed, scheduledMin: t.min - remainingNeed });
      }
    });

    return { placed, unfit, candidateCount: candidates.length };
  }

  // --- Recurring monthly task templates ---
  async function renderRecurringManage(){
    wizard.innerHTML = `<div class="empty-note">読み込み中…</div>`;
    const { data, error } = await sb.from('recurring_month_tasks').select('*').order('name');
    if(state.screen !== 'recurring-manage') return; // navigated away while loading
    if(error){
      wizard.innerHTML = `
        <div class="sched-unfit">一覧の取得に失敗しました: ${error.message || JSON.stringify(error)}</div>
        <div class="btn-row"><button class="btn btn-ghost" id="backToMonth">月間ビューに戻る</button></div>
      `;
      document.getElementById('backToMonth').addEventListener('click', ()=>{ state.screen='month'; render(); });
      return;
    }
    const templates = data || [];
    state.recurringTemplates = templates; // keep the shared cache in sync with what's actually in the DB
    const rowsHtml = templates.length ? templates.map(t=>`
      <div class="friend-row">
        <div class="name">${t.name}<span style="color:var(--ink-soft); font-size:11px;"> ・${t.min}分${t.deadline_day ? ' ・毎月' + t.deadline_day + '日が期限' : ''}${t.start_ym ? ' ・' + t.start_ym + '〜' + (t.end_ym || '無期限') : ''}</span></div>
        <button data-stopid="${t.id}">停止</button>
      </div>
    `).join('') : `<div class="empty-note">毎月繰り返す業務はまだ登録されていません。「今月の業務を追加」で「毎月繰り返す業務にする」をオンにすると、ここに表示されます。</div>`;
    wizard.innerHTML = `
      <div class="card">
        ${rowsHtml}
        <div class="q-hint" style="margin-top:12px;">「停止」を押すと、来月以降は自動追加されなくなります。すでに追加された今月分の業務はそのまま残ります。</div>
      </div>
      <div class="btn-row"><button class="btn btn-ghost" id="backToMonth">月間ビューに戻る</button></div>
    `;
    document.querySelectorAll('[data-stopid]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        await deleteRecurringTemplate(btn.dataset.stopid);
        renderRecurringManage();
      });
    });
    document.getElementById('backToMonth').addEventListener('click', ()=>{ state.screen='month'; render(); });
  }

  function renderMonthSchedule(){
    if(state.monthSchedResult){
      renderMonthScheduleResult();
      return;
    }
    wizard.innerHTML = `
      <div class="card">
        <div class="field">
          <label class="field-label">いつまでに終わらせたいですか？（期限日）</label>
          <input type="date" id="monthDeadlineInput" value="${state.monthSchedDeadline}">
        </div>
        <div class="field">
          <label class="field-label">1日に使える時間</label>
          <div class="stepper-row">
            <button id="mdec5">−5</button>
            <button id="mdec1">−1</button>
            <input type="number" class="min-input" id="minPerDayInput" value="${state.monthSchedMinPerDay}" min="5" max="480">
            <button id="minc1">＋1</button>
            <button id="minc5">＋5</button>
          </div>
        </div>
        <div class="toggle-row">
          <label class="field-label" style="margin:0;">土日は含めない</label>
          <div class="switch ${state.monthSchedSkipWeekends?'on':''}" id="skipWeekendToggle"><div class="knob"></div></div>
        </div>
        <label class="field-label">取りかかれない日（任意）</label>
        <div id="excludeDaysList">${(state.monthSchedExcludeDays||[]).map((d,i)=>`
          <div class="busy-row">
            <input type="date" data-excludeidx="${i}" value="${d}">
            <button data-excluderm="${i}">削除</button>
          </div>
        `).join('')}</div>
        <button class="add-busy-btn" id="addExcludeDayBtn">＋ 取りかかれない日を追加</button>
        <div class="btn-row">
          <button class="btn btn-ghost" id="backMonthFromSched">月間ビューに戻る</button>
          <button class="btn btn-primary" id="runMonthSchedule">スケジュールを組む</button>
        </div>
      </div>
    `;
    document.getElementById('monthDeadlineInput').addEventListener('input', (e)=>{ state.monthSchedDeadline = e.target.value; });
    const minEl = document.getElementById('minPerDayInput');
    minEl.addEventListener('input', ()=>{ if(minEl.value !== '') state.monthSchedMinPerDay = Number(minEl.value); });
    minEl.addEventListener('blur', ()=>{
      state.monthSchedMinPerDay = Math.max(5, Math.min(480, Math.round(state.monthSchedMinPerDay)||60));
      minEl.value = state.monthSchedMinPerDay;
    });
    function adjustMin(delta){
      state.monthSchedMinPerDay = Math.max(5, Math.min(480, state.monthSchedMinPerDay + delta));
      minEl.value = state.monthSchedMinPerDay;
    }
    document.getElementById('mdec5').addEventListener('click', ()=>adjustMin(-5));
    document.getElementById('mdec1').addEventListener('click', ()=>adjustMin(-1));
    document.getElementById('minc1').addEventListener('click', ()=>adjustMin(1));
    document.getElementById('minc5').addEventListener('click', ()=>adjustMin(5));
    document.getElementById('skipWeekendToggle').addEventListener('click', ()=>{
      state.monthSchedSkipWeekends = !state.monthSchedSkipWeekends;
      render();
    });
    if(!state.monthSchedExcludeDays) state.monthSchedExcludeDays = [];
    wizard.querySelectorAll('[data-excludeidx]').forEach(el=>{
      el.addEventListener('input', ()=>{ state.monthSchedExcludeDays[Number(el.dataset.excludeidx)] = el.value; });
    });
    wizard.querySelectorAll('[data-excluderm]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        state.monthSchedExcludeDays.splice(Number(btn.dataset.excluderm), 1);
        render();
      });
    });
    document.getElementById('addExcludeDayBtn').addEventListener('click', ()=>{
      state.monthSchedExcludeDays.push('');
      render();
    });
    document.getElementById('backMonthFromSched').addEventListener('click', ()=>{ state.screen='month'; render(); });
    document.getElementById('runMonthSchedule').addEventListener('click', ()=>{
      if(!state.monthSchedDeadline) return;
      const { year, month } = state.monthCursor;
      const excludeDays = (state.monthSchedExcludeDays||[]).filter(Boolean);
      state.monthSchedResult = computeMonthSchedule(year, month, state.monthSchedDeadline, state.monthSchedMinPerDay, state.monthSchedSkipWeekends, excludeDays);
      render();
    });
  }

  function renderMonthScheduleResult(){
    const r = state.monthSchedResult;
    const rowsHtml = r.placed.length ? r.placed.map(item=>`
      <div class="sched-slot-row">
        <div class="sched-slot-time">${fmtDateLabel(item.dateStr)}</div>
        <div class="sched-slot-name">${item.task.name}${item.totalParts > 1 ? `（${item.part}/${item.totalParts}）` : ''}（${item.min}分）</div>
      </div>
    `).join('') : `<div class="empty-note">配置できる業務がありませんでした。</div>`;

    const unfitHtml = r.unfit.length ? `
      <div class="sched-unfit">
        期限日までの空き時間では、以下の業務を全ては割り振れませんでした：<br>
        ${r.unfit.map(u => '・' + u.task.name + '（' + (u.scheduledMin > 0 ? `${u.scheduledMin}分は割り振り済み、残り${u.shortfall}分が` : `${u.shortfall}分`) + '不足）').join('<br>')}
      </div>
    ` : '';

    wizard.innerHTML = `
      <div class="card">
        <div class="q-label" style="font-weight:900; margin-bottom:12px;">${fmtDateLabel(state.monthSchedDeadline)} までのおすすめスケジュール</div>
        ${rowsHtml}
        ${unfitHtml}
        <div class="sched-busy-note">1つの業務が1日で収まらない場合は、複数日に分けて割り振ります。「登録する」を押すと、それぞれの日の業務一覧に追加されます。完全に割り振れた業務は今月の業務リストから外れ、一部だけ割り振れた業務は残り分だけ月間リストに残ります。</div>
      </div>
      <div class="btn-row">
        <button class="btn btn-ghost" id="editMonthConditions">条件を変える</button>
        <button class="btn btn-primary" id="applyMonthSchedule">この内容で登録する</button>
      </div>
      <div class="btn-row"><button class="btn btn-ghost" id="backMonthFromResult">月間ビューに戻る</button></div>
    `;
    document.getElementById('editMonthConditions').addEventListener('click', ()=>{
      state.monthSchedResult = null;
      render();
    });
    document.getElementById('applyMonthSchedule').addEventListener('click', ()=>{
      const { year, month } = state.monthCursor;
      const monthList = loadMonthTasks(year, month);

      // add each scheduled chunk to its day's task list
      r.placed.forEach(item=>{
        const dayList = loadTasks(item.dateStr);
        const label = item.totalParts > 1 ? `${item.task.name}（${item.part}/${item.totalParts}）` : item.task.name;
        dayList.push({ id: crypto.randomUUID(), name: label, min: item.min, time: '', done: false, monthTaskId: item.task.id });
        saveTasks(item.dateStr, dayList);
      });

      // sum how much of each original task got scheduled
      const scheduledByTaskId = {};
      r.placed.forEach(item=>{
        const key = String(item.task.id);
        scheduledByTaskId[key] = (scheduledByTaskId[key] || 0) + item.min;
      });

      // fully-scheduled tasks stay in the list (flagged so they aren't re-scheduled next time);
      // partially-scheduled tasks shrink to just their remaining, still-unscheduled minutes
      const updatedMonthList = [];
      monthList.forEach(t=>{
        const scheduled = scheduledByTaskId[String(t.id)] || 0;
        if(scheduled <= 0){ updatedMonthList.push(t); return; }
        const remaining = t.min - scheduled;
        if(remaining > 0){ updatedMonthList.push({ ...t, min: remaining }); }
        else{ updatedMonthList.push({ ...t, scheduled: true }); }
      });
      saveMonthTasks(year, month, updatedMonthList);

      state.monthSchedResult = null;
      state.screen = 'month';
      render();
    });
    document.getElementById('backMonthFromResult').addEventListener('click', ()=>{ state.monthSchedResult = null; state.screen='month'; render(); });
  }

  // --- Month view ---
  function daysInMonth(year, month){ return new Date(year, month+1, 0).getDate(); }
  function monthDateStr(year, month, day){
    return year + '-' + String(month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
  }

  function renderMonth(){
    const { year, month } = state.monthCursor;
    const ym = year + '-' + String(month+1).padStart(2,'0');
    if(!state.recurringCheckedMonths) state.recurringCheckedMonths = new Set();
    if(!state.recurringCheckedMonths.has(ym)){
      state.recurringCheckedMonths.add(ym);
      ensureRecurringTasksForMonth(year, month).then(changed=>{
        if(changed && state.screen === 'month' && state.monthCursor.year === year && state.monthCursor.month === month) render();
      });
    }
    const numDays = daysInMonth(year, month);
    const firstDow = new Date(year, month, 1).getDay(); // 0=Sun
    const today = todayStr();

    let totalTasks = 0, totalDone = 0, daysWithTasks = 0, daysAllDone = 0;
    const dayStats = [];
    const dayTasksThisMonth = [];
    for(let d=1; d<=numDays; d++){
      const ds = monthDateStr(year, month, d);
      const tasks = loadTasks(ds);
      const done = tasks.filter(t=>t.done).length;
      dayStats.push({ day:d, dateStr:ds, total:tasks.length, done });
      tasks.forEach(t=> dayTasksThisMonth.push({ ...t, dateStr: ds }));
      if(tasks.length){
        daysWithTasks++;
        totalTasks += tasks.length;
        totalDone += done;
        if(done === tasks.length) daysAllDone++;
      }
    }
    const overallPct = totalTasks ? Math.round((totalDone/totalTasks)*100) : 0;

    const monthTaskKey = monthTasksKey(year, month);
    const monthTasks = loadMonthTasks(year, month);
    const monthDone = monthTasks.filter(t=>t.done).length;
    const monthTotal = monthTasks.length;
    const monthPct = monthTotal ? Math.round((monthDone/monthTotal)*100) : 0;
    const monthTaskRowsHtml = monthTasks.length ? monthTasks.map(t=>`
      <div class="task-row ${t.done?'done':''}">
        <button class="task-check ${t.done?'done':''}" data-mid="${t.id}">${t.done?'✓':''}</button>
        <div class="task-body">
          <div class="task-name">${t.name}</div>
          <div class="task-meta"><span class="task-badge">${t.min}分</span>${t.deadline ? `<span class="task-badge">期限:${fmtDateLabel(t.deadline)}</span>` : ''}${t.recurringId ? `<span class="task-badge">🔁 毎月</span>` : ''}${t.scheduled ? `<span class="task-badge">📅 配分済み</span>` : ''}</div>
        </div>
        <div class="task-actions">
          <button data-medit="${t.id}">編集</button>
          <button data-mdel="${t.id}">削除</button>
        </div>
      </div>
    `).join('') : `<div class="empty-note">今月中にやる業務はまだ登録されていません。</div>`;

    const sortedDayTasks = [...dayTasksThisMonth].sort((a,b)=> a.dateStr < b.dateStr ? -1 : a.dateStr > b.dateStr ? 1 : 0);
    const dayTaskRowsHtml = sortedDayTasks.length ? sortedDayTasks.map(t=>`
      <div class="task-row ${t.done?'done':''}" data-jumpdate="${t.dateStr}" style="cursor:pointer;">
        <div style="width:26px; flex:0 0 auto; text-align:center; margin-top:2px; font-size:11px; color:${t.done?'var(--teal)':'var(--ink-soft)'};">${t.done?'✓':'○'}</div>
        <div class="task-body">
          <div class="task-name">${t.name}</div>
          <div class="task-meta"><span class="task-badge">${fmtDateLabel(t.dateStr)}</span><span class="task-badge">${t.min}分</span></div>
        </div>
      </div>
    `).join('') : `<div class="empty-note">今月、日付を指定して登録された業務はありません。</div>`;

    const dowLabels = ['日','月','火','水','木','金','土'].map(d=>`<div class="month-dow">${d}</div>`).join('');
    const blanks = Array.from({length:firstDow}).map(()=>`<div class="month-cell empty"></div>`).join('');
    const cellsHtml = dayStats.map(ds=>{
      let cls = 'month-cell';
      if(ds.dateStr === today) cls += ' today';
      let dotHtml = '';
      if(ds.total > 0){
        if(ds.done === ds.total){ cls += ' all-done'; dotHtml = `<div class="dot all-done"></div>`; }
        else { cls += ' partial'; dotHtml = `<div class="dot partial"></div>`; }
      }
      return `<div class="${cls}" data-date="${ds.dateStr}">
        <div class="daynum">${ds.day}</div>
        ${ds.total ? `<div class="ratio">${ds.done}/${ds.total}</div>` : dotHtml}
      </div>`;
    }).join('');

    wizard.innerHTML = `
      ${state.recurringSyncError ? `<div class="sched-unfit">${state.recurringSyncError}</div>` : ''}
      <div class="month-nav">
        <button id="prevMonth">◀</button>
        <div class="label">${year}年${month+1}月</div>
        <button id="nextMonth">▶</button>
      </div>

      <div class="card">
        <div class="progress-bar-wrap"><span>${month+1}月中にやる業務</span><b>${monthDone}/${monthTotal}</b></div>
        <div class="progress-track"><div class="progress-fill" style="width:${monthPct}%;"></div></div>
      </div>
      <div class="card">${monthTaskRowsHtml}</div>
      <div class="btn-row">
        <button class="btn btn-primary" id="addMonthTaskBtn">＋ 今月の業務を追加</button>
      </div>
      <div class="nav-btn-row">
        <button class="nav-btn" id="goMonthSchedule" style="flex:none; width:100%;"><span class="nav-icon">🗓️</span>今月のスケジュールを組む</button>
      </div>
      <button class="friend-link" id="goRecurringManage">🔁 毎月の業務を管理</button>

      <div class="q-label" style="margin-top:26px; margin-bottom:6px;">日付を指定して登録された今月の業務</div>
      <div class="q-hint" style="margin-bottom:12px;">「今日の業務」から登録した、今月の各日の業務です。タップするとその日に移動します。</div>
      <div class="card">${dayTaskRowsHtml}</div>

      <div class="card" style="margin-top:18px;">
        <div class="month-stats">
          <div class="stat"><b>${daysWithTasks}</b><span>業務のある日</span></div>
          <div class="stat"><b>${daysAllDone}</b><span>全完了の日</span></div>
          <div class="stat"><b>${overallPct}%</b><span>全体完了率</span></div>
        </div>
        <div class="month-grid">${dowLabels}${blanks}${cellsHtml}</div>
      </div>
      <div class="btn-row"><button class="btn btn-ghost" id="backToday">今日に戻る</button></div>
    `;
    wizard.querySelectorAll('[data-mid]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.mid;
        const list = loadMonthTasks(year, month);
        const t = list.find(x=>String(x.id)===id);
        if(t) t.done = !t.done;
        saveMonthTasks(year, month, list);
        renderMonth();
      });
    });
    wizard.querySelectorAll('[data-medit]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.medit;
        const t = loadMonthTasks(year, month).find(x=>String(x.id)===id);
        if(!t) return;
        state.editingTaskId = id;
        state.formName = t.name; state.formMin = t.min;
        state.formTimeOn = false; state.formTime = ''; state.formDeadline = t.deadline || '';
        state.formScope = 'month';
        state.formStorageKey = monthTaskKey;
        state.formReturnScreen = 'month';
        state.screen = 'add-task';
        render();
      });
    });
    wizard.querySelectorAll('[data-mdel]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.mdel;
        const list = loadMonthTasks(year, month).filter(x=>String(x.id)!==id);
        saveMonthTasks(year, month, list);
        deleteDayTasksByMonthTaskId(id);
        renderMonth();
      });
    });
    document.getElementById('addMonthTaskBtn').addEventListener('click', ()=>{
      state.editingTaskId = null;
      state.formName = ''; state.formMin = 30; state.formTimeOn = false; state.formTime = ''; state.formDeadline = ''; state.formRecurring = false; state.formDeadlineDay = ''; state.formError = '';
      state.formStartYm = year + '-' + String(month+1).padStart(2,'0');
      state.formEndYm = '';
      state.formScope = 'month';
      state.formStorageKey = monthTaskKey;
      state.formReturnScreen = 'month';
      state.screen = 'add-task';
      render();
    });
    document.getElementById('goMonthSchedule').addEventListener('click', ()=>{
      if(!state.monthSchedDeadline){
        const lastDay = daysInMonth(year, month);
        state.monthSchedDeadline = monthDateStr(year, month, lastDay);
      }
      state.monthSchedResult = null;
      state.screen = 'month-schedule';
      render();
    });
    document.getElementById('goRecurringManage').addEventListener('click', ()=>{
      state.screen = 'recurring-manage';
      render();
    });
    wizard.querySelectorAll('[data-jumpdate]').forEach(row=>{
      row.addEventListener('click', ()=>{
        state.viewDate = row.dataset.jumpdate;
        state.screen = 'day-detail';
        render();
      });
    });
    document.getElementById('prevMonth').addEventListener('click', ()=>{
      let { year, month } = state.monthCursor;
      month--; if(month < 0){ month = 11; year--; }
      state.monthCursor = { year, month };
      render();
    });
    document.getElementById('nextMonth').addEventListener('click', ()=>{
      let { year, month } = state.monthCursor;
      month++; if(month > 11){ month = 0; year++; }
      state.monthCursor = { year, month };
      render();
    });
    wizard.querySelectorAll('.month-cell[data-date]').forEach(cell=>{
      cell.addEventListener('click', ()=>{
        state.viewDate = cell.dataset.date;
        state.screen = 'day-detail';
        render();
      });
    });
    document.getElementById('backToday').addEventListener('click', ()=>{ state.screen='today'; state.viewDate=todayStr(); render(); });
  }

  state.viewDate = todayStr();

  (async function start(){
    wizard.innerHTML = `<div class="empty-note">読み込み中…</div>`;
    try{
      const savedUserId = lsGet('current-user-id');
      if(savedUserId){
        currentUserId = savedUserId;
        await loadAllFromSupabase();
        state.screen = 'today';
      } else {
        state.screen = 'auth';
      }
    } catch(err){
      console.error('startup error', err);
      state.screen = 'auth';
    }
    render();
  })();

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
